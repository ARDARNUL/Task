services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test_app
    restart: unless-stopped
    working_dir: /var/www
    user: "0:0"
    volumes:
      - ./src:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - test_net
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: test_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - test_net
    depends_on:
      - app

  db:
    image: mysql:8.4
    container_name: test_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - test_db_data:/var/lib/mysql
    networks:
      - test_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: test_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    ports:
      - "8081:80"
    networks:
      - test_net
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    container_name: test_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - test_redis_data:/data
    networks:
      - test_net

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test_queue
    restart: unless-stopped
    working_dir: /var/www
    user: "0:0"
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./src:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - test_net
    depends_on:
      - db
      - redis

  browser:
    build:
      context: ./browser
      dockerfile: Dockerfile
    container_name: test_browser
    restart: unless-stopped
    shm_size: "1gb"
    ports:
      - "3000:3000"
    volumes:
      - ./browser/server.js:/app/server.js:ro
    networks:
      - test_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  test_net:
    driver: bridge

volumes:
  test_db_data:
  test_redis_data: